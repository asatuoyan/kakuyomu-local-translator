<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说翻译</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#24302c;background:#f4f5f1;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e0e5dd;padding:20px max(24px,calc((100vw - 1040px)/2));display:flex;align-items:center;gap:35px}header strong{font-size:20px;white-space:nowrap}nav{display:flex;gap:8px}button,a.button{font:inherit;cursor:pointer;border:1px solid #d9dfd7;border-radius:8px;padding:10px 16px;background:white;color:inherit;text-decoration:none;display:inline-block}button.primary,nav button.active{background:#28624b;color:white;border-color:#28624b}button:disabled{opacity:.5;cursor:default}main{max-width:1040px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin:0 0 10px}h2{font-size:18px;margin:0 0 20px}.muted{color:#66746b;line-height:1.7}section.card{background:white;border:1px solid #e0e5dd;border-radius:14px;padding:26px;margin:24px 0}label{display:block;margin-bottom:8px}input,select{font:inherit;color:inherit;width:100%;padding:11px 12px;border:1px solid #ced7cc;border-radius:8px;background:white}input:focus,select:focus{outline:2px solid #6a987d;outline-offset:1px}.row{display:flex;gap:16px;align-items:end}.row>div{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}details{margin-top:18px}summary{cursor:pointer;color:#536c5c}details .row{margin-top:16px}progress{width:100%;height:12px;accent-color:#28624b;margin:16px 0}.book{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #edf0ea;gap:12px}.book:last-child{border:0}.book p{margin:5px 0}.book .actions{margin:0;flex-shrink:0}#notice{position:sticky;top:12px;background:#fff0d6;border:1px solid #dfc694;border-radius:8px;padding:12px;z-index:3}table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:#65756a}td,th{padding:12px 8px;border-bottom:1px solid #e9ede6}td input{min-width:120px}.scroll{overflow:auto}#termsPage .actions{margin:16px 0}.hidden,[hidden]{display:none!important}.pill{font-size:12px;color:#28624b;background:#eaf2e9;padding:4px 8px;border-radius:20px}footer{color:#7a867e;font-size:13px;margin:28px 0}@media(max-width:650px){header{padding:16px;gap:14px}main{margin:24px auto;padding:0 16px}section.card{padding:18px}.row{flex-direction:column;align-items:stretch}.book{align-items:start;flex-direction:column}h1{font-size:24px}}
</style></head><body>
<header><strong>小说翻译</strong><nav><button id="translateTab" class="active">获取并翻译</button><button id="termsTab">术语</button></nav></header>
<main><div id="notice" hidden role="alert"></div>
<div id="translatePage"><h1>获取小说，直接翻译</h1><div class="muted">输入作品网址即可开始。首次译文中的名词会自动保存，供后续章节沿用。</div>
<section class="card"><form id="startForm"><div class="row"><div><label for="url">小说网址</label><input id="url" type="url" placeholder="https://kakuyomu.jp/works/… 或 https://ncode.syosetu.com/…/"></div><div><label for="recent">最近使用的小说</label><select id="recent"><option value="">选择小说，或直接输入新网址</option></select></div></div>
<div class="row" style="margin-top:18px"><div><label for="model">翻译模型</label><select id="model" disabled><option value="">正在读取已安装模型…</option></select></div><button id="refreshModels" type="button">刷新模型</button></div><div id="modelStatus" class="muted" role="status"></div>
<details id="settings"><summary>本地 EPUB 与翻译设置</summary><div class="row"><div><label for="source">本地 EPUB 路径</label><input id="source" placeholder="C:\小说\原文.epub"></div><div><label for="language">译文语言</label><select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁体中文</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option><option value="fr">法文</option><option value="de">德文</option><option value="es">西班牙文</option></select></div></div></details>
<div class="actions"><button id="start" class="primary" type="submit">获取并翻译</button><button id="stop" type="button" disabled>停止</button></div></form></section>
<section class="card"><h2>当前进度 <span id="percent" class="pill">0%</span></h2><progress id="progress" max="100" value="0"></progress><div id="pipelineCounts" class="muted" hidden></div><div class="muted" id="stageAcquisition">获取：准备就绪</div><div class="muted" id="stageTranslation">翻译：准备就绪</div><div class="muted" id="stageGlossary">术语：准备就绪</div><div id="message" class="muted" aria-live="polite">准备就绪</div><div id="result" class="actions"></div></section>
<section class="card"><h2>我的作品</h2><div id="books" class="muted">暂无作品，开始翻译后会显示在这里。</div></section></div>
<div id="termsPage" hidden><h1>术语</h1><div class="muted">默认使用首次译文中的译名。可直接修改，也可导出交给其他 AI 统一译名后导入。</div><section class="card"><label for="project">选择作品</label><select id="project"><option value="">暂无作品</option></select>
<p id="termCount" class="muted" role="status">已保存 0 条术语</p><div class="actions"><button id="save" class="primary">保存修改</button><button id="export">导出 JSON</button><button id="import">导入 JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<label for="termSearch">搜索术语</label><input id="termSearch" type="search" placeholder="原词、译名或类别"><section id="examples" class="card" hidden><h2 id="exampleTitle">术语例句</h2><div id="exampleContent"></div></section>
<p class="muted">导入文件保留 source、target 字段；同名原词更新译名。修改后用于后续翻译，已保存的译文保留。</p><div class="scroll"><table><thead><tr><th>原词</th><th>译名</th><th>类别</th><th>例句</th></tr></thead><tbody id="termRows"></tbody></table></div><p id="emptyTerms" class="muted">暂无术语，完成章节后会自动提取并保存。</p></section></div>
<footer>在本机运行 · 关闭启动窗口即退出服务</footer></main>
<script src="app.js"></script></body></html>
