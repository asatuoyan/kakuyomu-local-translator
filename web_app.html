<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说翻译</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#24302c;background:#f4f5f1;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e0e5dd;padding:20px max(24px,calc((100vw - 1040px)/2));display:flex;align-items:center;gap:35px}header strong{font-size:20px;white-space:nowrap}nav{display:flex;gap:8px}button,a.button{font:inherit;cursor:pointer;border:1px solid #d9dfd7;border-radius:8px;padding:10px 16px;background:white;color:inherit;text-decoration:none;display:inline-block}button.primary,nav button.active{background:#28624b;color:white;border-color:#28624b}button:disabled{opacity:.5;cursor:default}main{max-width:1040px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin:0 0 10px}h2{font-size:18px;margin:0 0 20px}.muted{color:#66746b;line-height:1.7}section.card{background:white;border:1px solid #e0e5dd;border-radius:14px;padding:26px;margin:24px 0}label{display:block;margin-bottom:8px}input,select{font:inherit;color:inherit;width:100%;padding:11px 12px;border:1px solid #ced7cc;border-radius:8px;background:white}input:focus,select:focus{outline:2px solid #6a987d;outline-offset:1px}.row{display:flex;gap:16px;align-items:end}.row>div{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}details{margin-top:18px}summary{cursor:pointer;color:#536c5c}details .row{margin-top:16px}progress{width:100%;height:12px;accent-color:#28624b;margin:16px 0}.book{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #edf0ea;gap:12px}.book:last-child{border:0}.book p{margin:5px 0}.book .actions{margin:0;flex-shrink:0}#notice{position:sticky;top:12px;background:#fff0d6;border:1px solid #dfc694;border-radius:8px;padding:12px;z-index:3}table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:#65756a}td,th{padding:12px 8px;border-bottom:1px solid #e9ede6}td input{min-width:120px}.scroll{overflow:auto}#termsPage .actions{margin:16px 0}.hidden,[hidden]{display:none!important}.pill{font-size:12px;color:#28624b;background:#eaf2e9;padding:4px 8px;border-radius:20px}footer{color:#7a867e;font-size:13px;margin:28px 0}@media(max-width:650px){header{padding:16px;gap:14px}main{margin:24px auto;padding:0 16px}section.card{padding:18px}.row{flex-direction:column;align-items:stretch}.book{align-items:start;flex-direction:column}h1{font-size:24px}}
</style></head><body>
<header><strong>小说翻译</strong><nav><button id="translateTab" class="active">获取并翻译</button><button id="termsTab">术语</button></nav></header>
<main><div id="notice" hidden role="alert"></div>
<div id="translatePage"><h1>获取小说，直接翻译</h1><div class="muted">输入作品网址即可开始。首次译文中的名词会自动保存，供后续章节沿用。</div>
<section class="card"><form id="startForm"><label for="url">小说网址</label><input id="url" type="url" placeholder="https://kakuyomu.jp/works/… 或 https://ncode.syosetu.com/…/">
<div class="row" style="margin-top:18px"><div><label for="model">翻译模型</label><select id="model" disabled><option value="">正在读取已安装模型…</option></select></div><button id="refreshModels" type="button">刷新模型</button></div><div id="modelStatus" class="muted" role="status"></div>
<details id="settings"><summary>本地 EPUB 与翻译设置</summary><div class="row"><div><label for="source">本地 EPUB 路径</label><input id="source" placeholder="C:\小说\原文.epub"></div><div><label for="language">译文语言</label><select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁体中文</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option><option value="fr">法文</option><option value="de">德文</option><option value="es">西班牙文</option></select></div></div></details>
<div class="actions"><button id="start" class="primary" type="submit">获取并翻译</button><button id="stop" type="button" disabled>停止</button></div></form></section>
<section class="card"><h2>当前进度 <span id="percent" class="pill">0%</span></h2><progress id="progress" max="100" value="0"></progress><div id="pipelineCounts" class="muted" hidden></div><div id="message" class="muted" aria-live="polite">准备就绪</div><div id="result" class="actions"></div></section>
<section class="card"><h2>我的作品</h2><div id="books" class="muted">暂无作品，开始翻译后会显示在这里。</div><details><summary>继续上次任务</summary><div id="history"></div></details></section></div>
<div id="termsPage" hidden><h1>术语</h1><div class="muted">默认使用首次译文中的译名。可直接修改，也可导出交给其他 AI 统一译名后导入。</div><section class="card"><label for="project">选择作品</label><select id="project"><option value="">暂无作品</option></select>
<p id="termCount" class="muted" role="status">已保存 0 条术语</p><div class="actions"><button id="save" class="primary">保存修改</button><button id="export">导出 JSON</button><button id="import">导入 JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<p class="muted">导入文件保留 source、target 字段；同名原词更新译名。修改后用于后续翻译，已保存的译文保留。</p><div class="scroll"><table><thead><tr><th>原词</th><th>译名</th><th>类别</th></tr></thead><tbody id="termRows"></tbody></table></div><p id="emptyTerms" class="muted">暂无术语，完成章节后会自动提取并保存。</p></section></div>
<footer>在本机运行 · 关闭启动窗口即退出服务</footer></main>
<script>
const $=id=>document.getElementById(id), token=location.pathname.split('/')[1];let state=null,entries=[],loadedProject='',dirty=false,manualProject=false;
function notice(message){$('notice').textContent=message;$('notice').hidden=!message}
function setTermCount(count){$('termCount').textContent=`已保存 ${count} 条术语`}
function projectLabel(project){return `${project.title} · ${project.language||'译文'} · ${project.term_count||0} 条术语`}
async function api(path,body){const response=await fetch('api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Local-App':token},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
function button(label,action){const b=document.createElement('button');b.textContent=label;b.onclick=()=>Promise.resolve().then(action).catch(e=>notice(e.message));return b}
function tab(terms){$('translatePage').hidden=terms;$('termsPage').hidden=!terms;$('translateTab').classList.toggle('active',!terms);$('termsTab').classList.toggle('active',terms);if(terms)loadTerms().catch(e=>notice(e.message))}
$('translateTab').onclick=()=>tab(false);$('termsTab').onclick=()=>tab(true);
async function read(project){const popup=window.open('about:blank','_blank');try{const result=await api('read',{project});if(popup)popup.location=result.url;else notice('浏览器阻止了阅读窗口，请允许弹出窗口后重试')}catch(e){if(popup)popup.close();throw e}}
function renderBooks(projects){$('books').replaceChildren();for(const p of projects){const row=document.createElement('div');row.className='book';const info=document.createElement('div'),name=document.createElement('strong'),desc=document.createElement('p');name.textContent=p.title;desc.textContent=`${p.chapters} 章 · ${p.language||'译文'}`;info.append(name,desc);const actions=document.createElement('div');actions.className='actions';actions.append(button('阅读',()=>read(p.id)),button('术语',async()=>{manualProject=true;$('project').value=p.id;tab(true)}));row.append(info,actions);$('books').append(row)}if(!projects.length)$('books').textContent='暂无作品，开始翻译后会显示在这里。';const previous=(!manualProject&&!dirty&&state?.task.project)?state.task.project:$('project').value;$('project').replaceChildren();for(const p of projects){const option=document.createElement('option');option.value=p.id;option.textContent=projectLabel(p);$('project').append(option)}if(projects.some(p=>p.id===previous))$('project').value=previous}
async function poll(){try{state=await api('status');renderCounts();const t=state.task;$('start').disabled=t.running||modelsLoading||!$('model').value;$('model').disabled=t.running||modelsLoading||!$('model').options.length;$('refreshModels').disabled=t.running||modelsLoading;$('stop').disabled=!t.running;$('progress').value=t.percent;$('percent').textContent=t.percent+'%';$('message').textContent=t.message;$('save').disabled=t.running;$('import').disabled=t.running;if(document.activeElement!==$('project'))renderBooks(state.projects);$('result').replaceChildren();if(t.output){const a=document.createElement('a');a.className='button';a.textContent='下载 EPUB';const path=t.output.replaceAll('\\','/');const output=path.substring(path.lastIndexOf('/output/')+8);a.href='api/download?file='+encodeURIComponent(t.project+'/'+path.split('/').at(-1));$('result').append(a);if(t.project)$('result').append(button('阅读译文',()=>read(t.project)))}$('history').replaceChildren();for(const h of state.history){$('history').append(button(h.url||h.source,()=>{$('url').value=h.url;$('source').value=h.source;$('language').value=h.language;$('settings').open=!!h.source;tab(false)}))}if(!$('termsPage').hidden&&!dirty)await loadTerms()}catch(e){notice('连接失败：'+e.message)}finally{setTimeout(poll,2500)}}
async function loadTerms(){const project=$('project').value;if(dirty&&project===loadedProject)return;if(dirty&&project!==loadedProject&&!confirm('放弃未保存的术语修改？')){$('project').value=loadedProject;return}entries=project?(await api('terms?project='+encodeURIComponent(project))).entries:[];loadedProject=project;dirty=false;$('termRows').replaceChildren();$('emptyTerms').hidden=!!entries.length;setTermCount(entries.length);for(const e of entries){const row=document.createElement('tr');for(const key of ['source','target','category']){const cell=document.createElement('td');if(key==='target'){const input=document.createElement('input');input.value=e.target;input.setAttribute('aria-label',e.source+'的译名');input.oninput=()=>{e.target=input.value;dirty=true};cell.append(input)}else cell.textContent=e[key];row.append(cell)}$('termRows').append(row)}}
$('project').onchange=()=>{manualProject=true;loadTerms().catch(e=>notice(e.message))};
$('startForm').onsubmit=async event=>{event.preventDefault();notice('');$('start').disabled=true;try{await api('start',{url:$('url').value,source:$('source').value,language:$('language').value,model:$('model').value});$('message').textContent='正在启动…'}catch(e){notice(e.message);$('start').disabled=modelsLoading||!$('model').value}};
$('stop').onclick=async()=>{try{await api('stop',{});$('message').textContent='正在停止…'}catch(e){notice(e.message)}};
$('save').onclick=async()=>{try{const result=await api('terms',{project:loadedProject,entries});dirty=false;notice('已保存 '+result.saved+' 条术语')}catch(e){notice(e.message)}};
$('export').onclick=()=>{if(!loadedProject){notice('请先选择作品');return}const blob=new Blob([JSON.stringify({entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='glossary.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>{if(!loadedProject){notice('请先选择作品');return}$('importFile').click()};
$('importFile').onchange=async()=>{const file=$('importFile').files[0];if(!file)return;try{if(dirty)throw Error('请先保存当前修改，再导入文件');const data=JSON.parse(await file.text());let incoming=Array.isArray(data)?data:data.entries;if(!incoming&&typeof data==='object'&&data!==null)incoming=Object.entries(data).map(([source,target])=>({source,target}));if(!Array.isArray(incoming)||incoming.some(e=>!e||typeof e.source!=='string'||typeof e.target!=='string'||!e.source.trim()||!e.target.trim()))throw Error('每条术语都需要非空的 source 和 target');const result=await api('terms',{project:loadedProject,entries:incoming,merge:true});await loadTerms();notice('已导入并保存，当前共 '+result.saved+' 条术语')}catch(e){notice(e.message)}finally{$('importFile').value=''}};
let modelsLoading=false;
async function refreshModels(){const previous=$('model').value;modelsLoading=true;$('model').disabled=true;$('refreshModels').disabled=true;$('start').disabled=true;$('modelStatus').textContent='正在连接 Ollama…';try{const data=await api('models');$('model').replaceChildren();for(const name of data.models){const option=document.createElement('option');option.value=name;option.textContent=name;$('model').append(option)}$('model').value=data.models.includes(previous)?previous:data.selected;$('modelStatus').textContent=data.models.length?'':'没有已安装模型，请安装后刷新';}catch(e){$('model').replaceChildren();$('modelStatus').textContent=e.message;}finally{modelsLoading=false;const busy=!!state?.task.running;$('model').disabled=busy||!$('model').options.length;$('refreshModels').disabled=busy;$('start').disabled=busy||!$('model').value;}}
$('refreshModels').onclick=refreshModels;
function renderCounts(){const counts=state?.task.counts;$('pipelineCounts').hidden=!counts;if(counts)$('pipelineCounts').textContent=`获取 ${counts.acquired}/${counts.total} 章 · 翻译 ${counts.translated}/${counts.total} 章`;}
refreshModels();poll();
</script></body></html>
