<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时阅读</title>
<style>
button:disabled{display:none!important}
:root{color-scheme:light;--bg:#f7f3e9;--fg:#302c26;--panel:#fffaf0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#1d2025;--fg:#e5e1d9;--panel:#292d34}header{position:sticky;top:0;background:var(--panel);padding:12px;box-shadow:0 1px 5px #8884;z-index:1}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:900px;margin:auto}select,button{font:inherit;padding:6px;max-width:100%}select{flex:1;min-width:180px}label{white-space:nowrap}#status{font-size:13px;max-width:900px;margin:8px auto 0}main{max-width:800px;margin:auto;padding:24px 20px 80px;font-size:20px;line-height:1.9}h1{font-size:1.3em}p{white-space:pre-wrap;overflow-wrap:anywhere}.original{opacity:.7;margin-bottom:4px}.translation{margin-top:4px}body.bilingual .translation{border-left:2px solid #8888;padding-left:12px}

#directory{position:fixed;inset:0 auto 0 0;width:300px;background:var(--panel);z-index:4;padding:20px;overflow:auto;box-shadow:2px 0 12px #0002}#directory[hidden],#shade[hidden]{display:none}#shade{position:fixed;inset:0;background:#0005;z-index:3}#directory button{cursor:pointer}#directory nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);padding:10px;border-radius:6px}#directory nav button[aria-current="page"]{background:#8883;font-weight:bold}summary{cursor:pointer;padding:12px 0;font-weight:bold}#directory h2{font-size:18px;overflow-wrap:anywhere}.chapter-nav{display:flex;justify-content:space-between;max-width:800px;margin:0 auto;padding:0 20px 40px}body.directory-open main,body.directory-open .chapter-nav{transform:translateX(130px)}#chapters{display:none}button{color:var(--fg);background:var(--panel);border:1px solid #8885;border-radius:6px}#status{color:var(--fg);opacity:.65}@media(max-width:1100px){body.directory-open main,body.directory-open .chapter-nav{transform:none}}@media(min-width:1101px){#shade{display:none}}
</style>
<div id="shade" hidden></div><aside id="directory" aria-label="&#20998;&#21367;&#30446;&#24405;" hidden><button id="close-directory">&#25910;&#36215;&#30446;&#24405;</button><h2 id="book-title">&#23567;&#35828;&#30446;&#24405;</h2><nav id="volume-list"></nav></aside><header><div class="controls"><button id="toggle-directory" aria-expanded="false" aria-controls="directory">&#9776; &#30446;&#24405;</button><select id="chapters" aria-label="章节"><option value="">等待译文</option></select><label><input id="bilingual" type="checkbox">原文对照</label><button id="smaller" aria-label="缩小字号">A−</button><button id="larger" aria-label="增大字号">A+</button><label><input id="night" type="checkbox">夜间</label></div><div id="status" role="status">正在连接翻译程序……</div></header>
<main id="content"><h1>实时阅读</h1><p>开始翻译后，每完成一批段落就会在这里显示。</p></main>
<div class="chapter-nav"><button id="previous">&#19978;&#19968;&#31456;</button><button id="next">&#19979;&#19968;&#31456;</button></div>
<script>
const $=id=>document.getElementById(id),base=location.pathname;
let book='',current='',revision=-1,record=null,size=20,restoring=false;
let observedChapterIds=null,newChapterCount=0;
function chapterUpdates(ids,reset=false){
    if(reset||observedChapterIds===null){observedChapterIds=new Set(ids);newChapterCount=0;return}
    for(const id of ids){if(!observedChapterIds.has(id)){observedChapterIds.add(id);newChapterCount++}}
}
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
let prefs=read('reader-preferences',{});size=prefs.size||20;$('night').checked=!!prefs.night;$('bilingual').checked=!!prefs.bilingual;
function style(){document.body.classList.toggle('dark',$('night').checked);document.body.classList.toggle('bilingual',$('bilingual').checked);$('content').style.fontSize=size+'px';save('reader-preferences',{size,night:$('night').checked,bilingual:$('bilingual').checked})}style();
function positionKey(){return 'reader-position:'+book+':'+current}
function capturePosition(){
    const nodes=[...$('content').querySelectorAll('[data-paragraph]')];
    const line=document.querySelector('header').getBoundingClientRect().bottom+8;
    const node=nodes.find(p=>p.getBoundingClientRect().bottom>line)||nodes.at(-1);
    return node?{paragraph:Number(node.dataset.paragraph),offset:line-node.getBoundingClientRect().top,y:scrollY}: {y:scrollY};
}
function restorePosition(position){
    restoring=true;
    requestAnimationFrame(()=>{
        const node=position&&typeof position==='object'&&Number.isInteger(position.paragraph)?
            $('content').querySelector(`[data-paragraph="${position.paragraph}"]`):null;
        const line=document.querySelector('header').getBoundingClientRect().bottom+8;
        const y=node?scrollY+node.getBoundingClientRect().top+(position.offset||0)-line:
            typeof position==='number'?position:position?.y||0;
        scrollTo(0,Math.max(0,y));restoring=false;
    });
}
function render(restore=false,anchor=null){if(!record)return;const position=anchor??(restore?read(positionKey(),0):capturePosition());const main=$('content');main.replaceChildren();const h=document.createElement('h1');h.textContent=record.title;main.append(h);let count=0;record.translations.forEach((text,i)=>{if(!text)return;count++;if($('bilingual').checked){const p=document.createElement('p');p.className='original';p.textContent=record.originals[i];main.append(p)}const p=document.createElement('p');p.dataset.paragraph=String(i);p.className='translation';p.textContent=text;main.append(p)});if(!count){const p=document.createElement('p');p.textContent='等待本章第一批译文……';main.append(p)}restorePosition(position)}
$('bilingual').onchange=()=>{const position=capturePosition();style();render(false,position)};$('night').onchange=style;
function changeSize(delta){const position=capturePosition();size=Math.max(14,Math.min(36,size+delta));style();restorePosition(position)}
$('smaller').onclick=()=>changeSize(-2);$('larger').onclick=()=>changeSize(2);
let positionTimer=null;
function savePosition(){if(current&&!restoring)save(positionKey(),capturePosition())}
addEventListener('scroll',()=>{clearTimeout(positionTimer);positionTimer=setTimeout(savePosition,200)},{passive:true});
addEventListener('pagehide',savePosition);
$('chapters').onchange=()=>{newChapterCount=0;current=$('chapters').value;revision=-1;record=null;save('reader-chapter:'+book,current);poll()};
let catalogChapters=[],catalogSignature='';
function directory(open){$('directory').hidden=!open;$('shade').hidden=!open;document.body.classList.toggle('directory-open',open);$('toggle-directory').setAttribute('aria-expanded',String(open));if(!open)$('toggle-directory').focus()}
$('toggle-directory').onclick=()=>directory($('directory').hidden);$('close-directory').onclick=()=>directory(false);$('shade').onclick=()=>directory(false);addEventListener('keydown',e=>{if(e.key==='Escape')directory(false)});
function selectChapter(id){savePosition();clearTimeout(positionTimer);newChapterCount=0;current=id;revision=-1;record=null;save('reader-chapter:'+book,current);if(innerWidth<=1100)directory(false);poll()}
function navigation(){const peers=catalogChapters.filter(c=>c.language===catalogChapters.find(c=>c.id===current)?.language),i=peers.findIndex(c=>c.id===current);$('previous').disabled=i<=0;$('next').disabled=i<0||i>=peers.length-1;$('previous').onclick=()=>selectChapter(peers[i-1].id);$('next').onclick=()=>selectChapter(peers[i+1].id);document.querySelectorAll('#volume-list button').forEach(b=>{if(b.dataset.id===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function buildDirectory(chapters){const signature=JSON.stringify(chapters.map(c=>[c.id,c.title,c.volume,c.language]));if(signature===catalogSignature)return;catalogSignature=signature;const opened=new Set([...$('volume-list').querySelectorAll('details[open]')].map(d=>d.dataset.group));$('volume-list').replaceChildren();const groups=new Map();chapters.forEach(c=>{const group=c.language+' \u00b7 '+c.volume;if(!groups.has(group))groups.set(group,[]);groups.get(group).push(c)});groups.forEach((items,group)=>{const d=document.createElement('details');d.dataset.group=group;d.open=opened.has(group)||items.some(c=>c.id===current);const summary=document.createElement('summary');summary.textContent=group+'\uff08'+items.length+'\u7ae0\uff09';d.append(summary);items.forEach(c=>{const b=document.createElement('button');b.textContent=c.title;b.dataset.id=c.id;b.onclick=()=>selectChapter(c.id);d.append(b)});$('volume-list').append(d)})}
let pending=false,pollAgain=false,pollTimer=null;
async function readerFetch(url){
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
    try{
        const response=await fetch(url,{cache:'no-store',signal:controller.signal});
        if(!response.ok)throw Error('Reader request failed');
        return await response.json();
    }finally{clearTimeout(timeout)}
}
async function poll(){
    if(pending){pollAgain=true;return}
    clearTimeout(pollTimer);
    pending=true;
    try{
        const catalog=await readerFetch(base+'catalog'),changedBook=book!==catalog.book;
        if(changedBook){book=catalog.book;current=read('reader-chapter:'+book,'');revision=-1;record=null;catalogSignature=''}
        const ids=catalog.chapters.map(c=>c.id);
        chapterUpdates(ids,changedBook);
        if(JSON.stringify(ids)!==JSON.stringify([...$('chapters').options].map(o=>o.value))){
            $('chapters').replaceChildren();
            catalog.chapters.forEach(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.title;$('chapters').append(option)})
        }
        if(!ids.includes(current)){current=ids[0]||'';revision=-1;record=null}
        $('chapters').value=current;catalogChapters=catalog.chapters;
        $('book-title').textContent=catalog.title||'小说目录';
        buildDirectory(catalogChapters);navigation();
        const chapter=catalog.chapters.find(c=>c.id===current),requested=current;
        if(chapter&&chapter.revision!==revision){
            const next=await readerFetch(base+'chapter?id='+encodeURIComponent(requested));
            if(next&&current===requested){const first=revision===-1;record=next;revision=next.revision;render(first)}
        }
        $('status').textContent=chapter?(newChapterCount?`新增 ${newChapterCount} 章 · `:'')+'每两秒检查新译文 · 更新时保留阅读位置':'等待翻译开始……';
    }catch{$('status').textContent='连接已断开，正在重试；请保持电脑程序运行。'}
    finally{pending=false;pollTimer=setTimeout(poll,pollAgain?0:typeof document!=='undefined'&&document.hidden?30000:2000);pollAgain=false}
}
addEventListener('focus',()=>poll());
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition();else poll()});
poll();
</script></html>
